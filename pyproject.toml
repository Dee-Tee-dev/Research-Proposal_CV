[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-income-gap-study"
version = "0.2.0"
description = "Balanced multi-model Dollar Street benchmark across income quartiles"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "Pillow>=10,<13",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.44,<6",
  "tqdm>=4.66,<5",
  "gradio>=4.44,<7",
]

[project.optional-dependencies]
extended-models = [
  "accelerate>=0.34",
  "qwen-vl-utils>=0.0.8",
  "sentencepiece>=0.2",
  "ultralytics>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]
