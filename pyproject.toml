[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-income-gap-study"
version = "0.1.0"
description = "Balanced Dollar Street evaluation of CLIP and BLIP across income quartiles"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "Pillow>=10,<13",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.44,<6",
  "tqdm>=4.66,<5",
  "gradio>=4.44,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
